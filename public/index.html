<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>El Ganador</title>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" href="/el-ganador-logo.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      padding: 24px;
    }
    .splash-logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(245, 184, 46, 0.45));
      animation: pulse 2s infinite ease-in-out;
    }
    .splash-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f5b82e, #ffd700, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .splash-subtitle {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(245, 184, 46, 0.2);
      border-top-color: #f5b82e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.92; }
    }
    .btn-retry {
      display: none;
      margin-top: 15px;
      padding: 10px 20px;
      background: #f5b82e;
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="/el-ganador-logo.png" alt="El Ganador" class="splash-logo" onerror="this.style.display='none'" />
    <h1 class="splash-title">EL GANADOR</h1>
    <p class="splash-subtitle" id="status-text">Cargando aplicación...</p>
    <div class="spinner" id="spinner"></div>
    <button class="btn-retry" id="btn-retry" onclick="location.reload()">Reintentar conexión</button>
  </div>

  <script>
    // Si Capacitor no redirige automáticamente por server.url, redirigir al host configurado
    const targetUrl = 'https://el-ganador-mvp.vercel.app';
    setTimeout(() => {
      const status = document.getElementById('status-text');
      const btn = document.getElementById('btn-retry');
      const spinner = document.getElementById('spinner');
      if (status && btn) {
        status.textContent = 'Conectando con el servidor...';
        // Intento de redirección directa
        window.location.replace(targetUrl);
        setTimeout(() => {
          status.textContent = 'Verifica tu conexión a internet';
          btn.style.display = 'inline-block';
          if (spinner) spinner.style.display = 'none';
        }, 5000);
      }
    }, 1500);
  </script>
</body>
</html>
