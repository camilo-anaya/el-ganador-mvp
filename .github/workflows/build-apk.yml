name: Compilar APK Android El Ganador

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Compilar y Preparar Assets
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://reabawvvduiibgjhqrbo.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_QAumvB1nsYxCaRa5TvYjVQ_uU_DKSPt"
          NEXT_PUBLIC_WOMPI_PUBLIC_KEY: "pub_prod_szkcn750ePT0UEoi8Hil02CtApMvVCLV"
          NEXT_PUBLIC_APP_URL: "https://el-ganador-mvp.vercel.app"
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>El Ganador</title></head><body style="background:#000000"></body></html>' > out/index.html
          npm run build || true
          npx cap sync android

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x android/gradlew

      - name: Asegurar dependencias de Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Compilar APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar y Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: ElGanador-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
