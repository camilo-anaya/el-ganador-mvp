name: Compilar APK Android El Ganador

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Compilar Proyecto Next.js y Sincronizar Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar y Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: ElGanador-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
